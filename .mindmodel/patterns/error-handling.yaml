# Error Handling Patterns

## Exception Hierarchy Pattern

Custom exceptions for domain-specific errors:

```csharp
// Base exception
namespace Lingarr.Server.Exceptions;

public class TranslationException : Exception
{
    public TranslationException(string message, Exception? exception = null) 
        : base(message, exception)
    {
    }
}

// Specialized exceptions
public class TranslationResponseException : TranslationException
{
    public TranslationResponseException(string message, string response) 
        : base(message)
    {
        Response = response;
    }
    
    public string Response { get; }
}
```

## Structured Logging Pattern

Logging with color markers and context:

```csharp
_logger.LogInformation(
    "TranslateJob started for subtitle: |Green|{filePath}|/Green|",
    subtitlePathForLog);

_logger.LogWarning(
    "Translation cancelled for subtitle: |Orange|{subtitlePath}|/Orange|",
    request.SubtitleToTranslate);

_logger.LogError(ex, 
    "Translation failed for request {RequestId}", 
    translationRequest.Id);
```

## Deferred Repair Pattern

Instead of immediate retry, defer repairs to a background job:

```csharp
public class DeferredRepairService : IDeferredRepairService
{
    public async Task ScheduleRepairAsync(
        TranslationRequest request,
        List<SubtitleItem> failedItems)
    {
        // Store failed items for later repair
        await _dbContext.DeferredRepairs.AddAsync(new DeferredRepair
        {
            TranslationRequestId = request.Id,
            FailedItems = JsonConvert.SerializeObject(failedItems),
            ScheduledAt = DateTime.UtcNow.AddMinutes(5)
        });
        
        await _dbContext.SaveChangesAsync();
    }
}

// Background job processes repairs
[AutomaticRetry(Attempts = 3)]
[DisableConcurrentExecution(timeoutInSeconds: 300)]
public async Task ExecuteRepairJobAsync(int repairId)
{
    var repair = await _dbContext.DeferredRepairs.FindAsync(repairId);
    var failedItems = JsonConvert.DeserializeObject<List<SubtitleItem>>(repair.FailedItems);
    
    // Attempt repair with smaller batches
    await RepairWithSmallerBatchesAsync(failedItems);
}
```

## Graduated Retry Pattern

Exponential backoff with jitter:

```csharp
// Retry logic for status update
for (int attempt = 0; attempt < 3; attempt++)
{
    try
    {
        translationRequest = await _translationRequestService
            .UpdateTranslationRequest(translationRequest, TranslationStatus.Failed, null);
        break; // Success, exit retry loop
    }
    catch (Exception retryEx) when (attempt < 2)
    {
        _logger.LogWarning(retryEx, 
            "Attempt {Attempt}/3 failed to update job status. Retrying in {Delay}s...", 
            attempt + 1, attempt + 1);
        await Task.Delay(TimeSpan.FromSeconds(attempt + 1));
    }
}
```

## Try-Catch with Cleanup Pattern

Always clean up resources in finally block:

```csharp
string? temporaryFilePath = null;
try
{
    // ... do work that might create temp files
    temporaryFilePath = await ExtractSubtitleAsync(...);
    // ... process subtitle
}
catch (TaskCanceledException)
{
    await HandleCancellation(request);
}
catch (Exception ex)
{
    _logger.LogError(ex, "Translation failed");
    throw;
}
finally
{
    // Always cleanup
    if (!string.IsNullOrEmpty(temporaryFilePath) && File.Exists(temporaryFilePath))
    {
        try
        {
            File.Delete(temporaryFilePath);
        }
        catch (Exception ex)
        {
            _logger.LogWarning(ex, "Failed to delete temporary file");
        }
    }
}
```

## Global Exception Handling

Middleware for unhandled exceptions:

```csharp
public class GlobalExceptionMiddleware
{
    private readonly RequestDelegate _next;
    private readonly ILogger<GlobalExceptionMiddleware> _logger;
    
    public async Task InvokeAsync(HttpContext context)
    {
        try
        {
            await _next(context);
        }
        catch (TranslationException ex)
        {
            _logger.LogError(ex, "Translation error occurred");
            context.Response.StatusCode = 400;
            await context.Response.WriteAsJsonAsync(new { error = ex.Message });
        }
        catch (Exception ex)
        {
            _logger.LogError(ex, "Unhandled exception");
            context.Response.StatusCode = 500;
            await context.Response.WriteAsJsonAsync(new { error = "Internal server error" });
        }
    }
}
```

## Frontend Error Handling

Service-level error handling with user-friendly messages:

```typescript
async function loadTranslations() {
    try {
        await translationStore.fetch()
    } catch (error: any) {
        notificationStore.show({
            type: 'error',
            message: error?.data?.message || 'Failed to load translations'
        })
    }
}
```

## Validation Error Pattern

```csharp
public class SubtitleValidationException : Exception
{
    public List<ValidationError> Errors { get; }
    
    public SubtitleValidationException(List<ValidationError> errors)
        : base("Subtitle validation failed")
    {
        Errors = errors;
    }
}

// Usage
if (!validationResult.IsValid)
{
    throw new SubtitleValidationException(validationResult.Errors);
}
```
