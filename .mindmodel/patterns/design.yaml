# Design Patterns

## Factory Pattern

Used for creating translation service instances based on configuration:

```csharp
public class TranslationFactory : ITranslationServiceFactory
{
    public ITranslationService CreateTranslationService(string serviceType)
    {
        return serviceType.ToLower() switch
        {
            "libretranslate" => new LibreService(...),
            "google" => new GTranslatorService<GoogleTranslator>(...),
            "deepl" => new DeepLService(...),
            "openai" => new OpenAiService(...),
            // ... 12 service types total
            _ => throw new ArgumentException("Unsupported translation service type")
        };
    }
}
```

## Strategy Pattern

Different translation service implementations share a common interface:

```csharp
public interface ITranslationService
{
    Task<string> TranslateAsync(
        string text, 
        string sourceLanguage, 
        string targetLanguage,
        List<string>? contextLinesBefore,
        List<string>? contextLinesAfter,
        CancellationToken cancellationToken);
    
    Task<List<SourceLanguage>> GetLanguages();
    Task<ModelsResponse> GetModels();
}
```

Implementations: `DeepLService`, `OpenAiService`, `AnthropicService`, `LibreService`, etc.

## Observer Pattern

SignalR hubs implement the observer pattern for real-time updates:

```csharp
public class TranslationRequestsHub : Hub
{
    public async Task JoinGroup(GroupRequest request)
    {
        await Groups.AddToGroupAsync(Context.ConnectionId, request.Group);
        await Clients.Caller.SendAsync("JoinedGroup", request.Group);
    }
}
```

Setting changes are broadcast to connected clients.

## Singleton Pattern

Worker services are registered as singletons:

```csharp
services.AddSingleton<TranslationWorkerService>();
services.AddHostedService(provider => provider.GetRequiredService<TranslationWorkerService>());
```

## Template Method Pattern

Base service classes define the algorithm structure:

```csharp
public abstract class BaseAiService
{
    // Template method defining the translation workflow
    public async Task<string> TranslateAsync(...)
    {
        var prompt = BuildPrompt(text, context);
        var response = await SendRequestAsync(prompt, cancellationToken);
        return ParseResponse(response);
    }
    
    // Abstract methods for subclasses to implement
    protected abstract string BuildPrompt(string text, List<string> context);
    protected abstract Task<string> SendRequestAsync(string prompt, CancellationToken token);
    protected abstract string ParseResponse(string response);
}
```

## Circuit Breaker Pattern

Implemented in `BatchFallbackService` and `DeferredRepairService`:

```csharp
public class BatchFallbackService : IBatchFallbackService
{
    private readonly IDeferredRepairService _deferredRepairService;
    
    public async Task<List<SubtitleItem>> ExecuteWithFallbackAsync(...)
    {
        try
        {
            return await ExecuteBatchAsync(...);
        }
        catch (TranslationException ex)
        {
            // Circuit breaker: defer repair instead of immediate retry
            await _deferredRepairService.ScheduleRepairAsync(...);
            throw;
        }
    }
}
```

## State Machine Pattern

Translation requests follow a 9-state state machine:

```csharp
public enum TranslationState
{
    Unknown = 0,
    NotApplicable = 1,
    Pending = 2,
    InProgress = 3,
    Complete = 4,
    Stale = 5,
    NoSuitableSubtitles = 6,
    Failed = 7,
    AwaitingSource = 8
}
```

## Builder Pattern

Used for constructing complex subtitle validation options:

```csharp
var validationOptions = new SubtitleValidationOptions
{
    MaxFileSizeBytes = 2 * 1024 * 1024,
    MaxSubtitleLength = 500,
    MinSubtitleLength = 2,
    MinDurationMs = 500,
    MaxDurationSecs = 10
};
```
