# Data Access Patterns

## Entity Framework Core Patterns

### DbContext as Unit of Work

```csharp
public class LingarrDbContext : DbContext
{
    public DbSet<Movie> Movies { get; set; }
    public DbSet<Show> Shows { get; set; }
    public DbSet<TranslationRequest> TranslationRequests { get; set; }
    
    public override Task<int> SaveChangesAsync(CancellationToken cancellationToken = default)
    {
        UpdateTimestamps();
        return base.SaveChangesAsync(cancellationToken);
    }
    
    private void UpdateTimestamps()
    {
        var entities = ChangeTracker.Entries()
            .Where(x => x.Entity is BaseEntity && 
                   (x.State == EntityState.Added || x.State == EntityState.Modified));
        
        foreach (var entity in entities)
        {
            if (entity.State == EntityState.Added)
            {
                ((BaseEntity)entity.Entity).CreatedAt = DateTime.UtcNow;
            }
            ((BaseEntity)entity.Entity).UpdatedAt = DateTime.UtcNow;
        }
    }
}
```

### Fluent Configuration Pattern

```csharp
public class MovieConfiguration : IEntityTypeConfiguration<Movie>
{
    public void Configure(EntityTypeBuilder<Movie> builder)
    {
        builder.HasKey(m => m.Id);
        builder.Property(m => m.Title).IsRequired().HasMaxLength(500);
        builder.HasMany(m => m.EmbeddedSubtitles)
               .WithOne()
               .HasForeignKey(es => es.MediaId);
    }
}
```

### Global Converter Pattern

All DateTime properties are automatically converted to UTC:

```csharp
protected override void OnModelCreating(ModelBuilder modelBuilder)
{
    var dateTimeConverter = new ValueConverter<DateTime, DateTime>(
        v => DateTime.SpecifyKind(v, DateTimeKind.Utc),
        v => DateTime.SpecifyKind(v, DateTimeKind.Utc));
    
    foreach (var entityType in modelBuilder.Model.GetEntityTypes())
    {
        foreach (var property in entityType.GetProperties())
        {
            if (property.ClrType == typeof(DateTime))
            {
                property.SetValueConverter(dateTimeConverter);
            }
        }
    }
}
```

### Eager Loading Pattern

```csharp
var episode = await _dbContext.Episodes
    .Include(e => e.Season)
    .ThenInclude(s => s.Show)
    .Include(e => e.EmbeddedSubtitles)
    .FirstOrDefaultAsync(e => e.Id == episodeId, cancellationToken);
```

### Query Filtering Pattern

```csharp
public async Task<IPagedResult<TranslationRequest>> GetRequestsAsync(
    int pageNumber,
    string searchQuery,
    string sortBy,
    bool isAscending)
{
    var query = _dbContext.TranslationRequests.AsQueryable();
    
    // Search filter
    if (!string.IsNullOrEmpty(searchQuery))
    {
        query = query.Where(r => 
            r.Title.Contains(searchQuery) ||
            r.SourceLanguage.Contains(searchQuery));
    }
    
    // Sorting
    query = isAscending 
        ? query.OrderBy(r => EF.Property<object>(r, sortBy))
        : query.OrderByDescending(r => EF.Property<object>(r, sortBy));
    
    // Paging
    var totalCount = await query.CountAsync();
    var items = await query
        .Skip((pageNumber - 1) * PageSize)
        .Take(PageSize)
        .ToListAsync();
    
    return new PagedResult<TranslationRequest>
    {
        Items = items,
        TotalCount = totalCount,
        PageNumber = pageNumber,
        PageSize = PageSize
    };
}
```

## Transaction Pattern

```csharp
using var transaction = await _dbContext.Database.BeginTransactionAsync();

try
{
    // Perform multiple operations
    _dbContext.TranslationRequests.Add(request);
    _dbContext.TranslationRequestLogs.AddRange(logs);
    
    await _dbContext.SaveChangesAsync();
    await transaction.CommitAsync();
}
catch (Exception)
{
    await transaction.RollbackAsync();
    throw;
}
```

## Multi-Database Support

Separate migration projects for PostgreSQL and SQLite:

```csharp
// PostgreSQL
public class PostgreSqlDbContextFactory : IDesignTimeDbContextFactory<LingarrDbContext>
{
    public LingarrDbContext CreateDbContext(string[] args)
    {
        var optionsBuilder = new DbContextOptionsBuilder<LingarrDbContext>();
        optionsBuilder.UseNpgsql(connectionString, b =>
            b.MigrationsAssembly("Lingarr.Migrations.PostgreSQL"));
        return new LingarrDbContext(optionsBuilder.Options);
    }
}

// SQLite
public class SqliteDbContextFactory : IDesignTimeDbContextFactory<LingarrDbContext>
{
    public LingarrDbContext CreateDbContext(string[] args)
    {
        var optionsBuilder = new DbContextOptionsBuilder<LingarrDbContext>();
        optionsBuilder.UseSqlite(connectionString, b =>
            b.MigrationsAssembly("Lingarr.Migrations.SQLite"));
        return new LingarrDbContext(optionsBuilder.Options);
    }
}
```
