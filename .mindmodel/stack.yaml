## Project Structure

```
lingarr-on-steroids/
├── Lingarr.Core/              # Domain entities, enums, data context
├── Lingarr.Server/            # ASP.NET Core Web API
│   ├── Controllers/           # API controllers
│   ├── Services/              # Business logic services
│   ├── Jobs/                  # Hangfire background jobs
│   ├── Hubs/                  # SignalR hubs
│   ├── Filters/               # Action filters
│   ├── Extensions/            # DI extensions
│   └── Interfaces/            # Service interfaces
├── Lingarr.Client/            # Vue.js frontend
│   ├── src/
│   │   ├── components/        # Vue components
│   │   ├── pages/             # Page components
│   │   ├── store/             # Pinia stores
│   │   ├── services/          # API service clients
│   │   ├── composables/       # Vue composables
│   │   └── ts/                # TypeScript types
├── Lingarr.Migrations.PostgreSQL/  # EF Core migrations for PostgreSQL
└── Lingarr.Migrations.SQLite/      # EF Core migrations for SQLite
```
