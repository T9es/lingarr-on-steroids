name: Bug Report
description: Report a bug or unexpected behavior in Lingarr on Steroids
title: '[BUG] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please fill in the sections below — the more detail you share, the faster we can reproduce and fix this.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      description: Please confirm the following to avoid duplicate or non-actionable reports.
      options:
        - label: I have searched existing issues and the Discussions for this problem
          required: true
        - label: I am running the latest release of Lingarr on Steroids
          required: true
        - label: This is a bug in existing functionality, not a feature request or a setup question
          required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      description: How are you running Lingarr?
      options:
        - Docker (compose)
        - Docker (manual run)
        - Bare metal / local build
        - Kubernetes / Helm
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database backend
      options:
        - PostgreSQL
        - SQLite
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: Affected translation service
      description: Which provider were you using when this happened? Pick "None" if unrelated.
      options:
        - None / not applicable
        - OpenAI
        - Anthropic
        - Gemini
        - DeepSeek
        - Chutes.ai
        - LocalAI
        - DeepL
        - LibreTranslate
        - Google Translate
        - Bing Translator
        - Yandex Translate
        - Azure Translator
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Lingarr version
      placeholder: e.g. v2.3.1 or the commit hash
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: Clear description of what went wrong, what you expected, and what actually happened.
      placeholder: 'Describe the issue here...'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps that trigger the bug. Include which movie/show, source instance, and target language.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste the matching container logs, Hangfire job output, or stack trace. Wrap code/output in triple backticks.
      render: bash
      placeholder: |
        ```
        paste logs here
        ```
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: 'Optional extras: screenshots, environment variables (redact secrets!), multi-instance setup, related features.'
